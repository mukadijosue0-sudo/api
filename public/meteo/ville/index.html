<link rel="stylesheet" href="/css/recherche.css">
<div class="page-card">
    <div class="page-header">
        <div class="page-header-top">
            <h1 class="page-title">
                Météo du jour à
            </h1>
            <div class="page-header-actions">
            </div>
        </div>
        <div class="page-header-filters">
            <div class="zone-recherche">
                <label for="search"></label>
                <div class="champ-recherche">
                    <div class="input-recherche">
                        <input
                                type="text"
                                id="search"
                                placeholder="nom de la ville."
                                autocomplete="off">

                        <span
                                class="icone-recherche"
                                aria-hidden="true">⌕</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-body">
        <div class="fiche">
            <label for="date">Date : </label>
            <output id="date"></output>

            <label for="heure">Heure : </label>
            <output id="heure"></output>

            <label for="nom">Ville : </label>
            <output id="nom"></output>

            <label for="temperature"> Temperature : </label>
            <output id="temperature" style="width: 20px"></output>

            <label for="condition">Condition :</label>
            <div class="condition-container">
                <output id="condition"></output>
                <img id="icone"></img>
            </div>

            <label for="journee">Journée :</label>
            <img id="journee" width="650" height="250"/>
        </div>
    </div>
</div>
